<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Warm Terracotta to Deep Coral -->
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26A45" />
      <stop offset="50%" stop-color="#D85C36" />
      <stop offset="100%" stop-color="#B84320" />
    </linearGradient>

    <!-- Subtle Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Bag Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCEEE8" />
    </linearGradient>

    <!-- Fold & Accent Gradient -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow Filter for Layered Depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5A1A05" flood-opacity="0.28" />
    </filter>

    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4A1303" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Squircle App-Icon Container with Smooth Curvature -->
  <rect width="512" height="512" rx="118" fill="url(#brandBg)" />
  <!-- Inner Highlight Rim for Premium Tactile Finish -->
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="url(#innerGlow)" stroke-width="4" />

  <!-- Main Emblem Group with Soft Elevation -->
  <g filter="url(#softShadow)">

    <!-- Shopping Bag Handle (Sleek Arc) -->
    <path d="M 186 195 C 186 130, 326 130, 326 195" 
          fill="none" 
          stroke="url(#handleGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- Shopping Bag Base Silhouette with Rounded Bottom -->
    <path d="M 132 208 
             C 132 195, 142 184, 155 184 
             L 357 184 
             C 370 184, 380 195, 380 208 
             L 394 372 
             C 396 394, 378 412, 356 412 
             L 156 412 
             C 134 412, 116 394, 118 372 
             Z" 
          fill="#2B2927" />

    <!-- Bag Opening Rim / Architectural Fold Detail -->
    <path d="M 148 198 L 364 198" 
          stroke="#44403C" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- Intertwined Monogram "S" & Ease Smile Swoosh -->
    <path d="M 314 246 
             C 292 224, 252 222, 230 236 
             C 204 252, 202 278, 224 296 
             L 288 344 
             C 316 366, 308 402, 268 404 
             C 238 405, 210 388, 198 372" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#markShadow)" />

    <!-- Dynamic Ease Sparkle / Star (Top Right Corner of Bag) -->
    <path d="M 334 220 
             Q 344 240, 364 246 
             Q 344 252, 334 272 
             Q 324 252, 304 246 
             Q 324 240, 334 220 Z" 
          fill="url(#accentGold)" />
  </g>
</svg>
