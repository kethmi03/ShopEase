<!DOCTYPE html>
<html lang="en" data-theme="light" data-font-size="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new ShopEase account for faster checkout, live inventory tracking, and order history.">
  <title>Create Account | ShopEase Accessible E-Commerce</title>
  
  <!-- Preconnect to font sources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <!-- Skip Link for Accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ARIA Live Region for screen reader announcements -->
  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Top Accessibility & Preferences Bar -->
  <header class="site-header" role="banner">
    <div class="header-island">
      <nav class="main-nav" aria-label="Registration Navigation">
        <div class="header-container" style="padding:0.25rem 0.5rem;">
          <a href="index.html" class="brand-logo" aria-label="ShopEase Home Page">
            <div class="brand-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="21" r="1"></circle>
                <circle cx="19" cy="21" r="1"></circle>
                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
              </svg>
            </div>
            <div class="brand-text">Shop<span>Ease</span></div>
          </a>

          <div class="nav-right-section">
            <!-- Theme Toggle (Icon only - No theme words) -->
            <button 
              type="button" 
              id="theme-toggle-btn" 
              class="theme-toggle-btn" 
              aria-label="Toggle color theme" 
              title="Switch color theme"
            >
              <span id="theme-icon" class="theme-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
              </span>
            </button>

            <a href="index.html" class="nav-btn nav-btn-ghost" aria-label="Return to store homepage">
              <span>Shop Catalog</span>
            </a>
            <a href="dashboard.html" class="nav-btn nav-btn-ghost" aria-label="Customer Dashboard">
              <span>Customer Dashboard</span>
            </a>
            <a href="admin.html" class="nav-btn nav-btn-ghost" aria-label="Admin Console">
              <span>🛡️ Admin Console</span>
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="main-content" class="auth-container">
    <div class="auth-card auth-card-wide" role="region" aria-label="Registration Form">
      <!-- Top Navigation & Brand -->
      <div class="back-to-store-bar">
        <a href="index.html" class="back-to-store-link" aria-label="Back to ShopEase catalog">
          ← Back to Shop
        </a>
        <button 
          type="button" 
          id="btn-fill-register-demo" 
          class="btn btn-secondary" 
          style="font-size:0.8rem; padding:0.35rem 0.75rem; display:inline-flex; align-items:center; gap:0.4rem;"
          title="Autofill sample registration fields for quick demonstration"
        >
          <span>Autofill Sample User</span>
        </button>
      </div>

      <div class="auth-header">
        <a href="index.html" class="brand-logo" aria-label="ShopEase Home Page">
          <div class="brand-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="21" r="1"></circle>
              <circle cx="19" cy="21" r="1"></circle>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
            </svg>
          </div>
          <div class="brand-text">Shop<span>Ease</span></div>
        </a>
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Join ShopEase for seamless shopping, orders tracking, and fast checkout.</p>
      </div>

      <!-- Authentication Navigation Tabs -->
      <div class="auth-tabs" role="tablist" aria-label="Account Access Options">
        <a href="login.html" class="auth-tab-link" role="tab" aria-selected="false">
          <span>Sign In</span>
        </a>
        <a href="register.html" class="auth-tab-link active" role="tab" aria-selected="true">
          <span>Create Account</span>
        </a>
      </div>

      <!-- General Error Display Container -->
      <div id="register-error-message" class="toast toast-danger" style="display:none; margin-bottom:1.25rem; font-size:0.875rem;" role="alert"></div>

      <!-- Registration Form -->
      <form id="register-form" novalidate>
        <div class="form-grid">
          <!-- Full Name -->
          <div class="form-group col-full">
            <label for="reg-name" class="form-label">
              <span>Full Name <span aria-hidden="true">*</span></span>
            </label>
            <input 
              type="text" 
              id="reg-name" 
              name="fullName" 
              class="form-input" 
              placeholder="e.g. Jordan Parker" 
              autocomplete="name" 
              required 
              aria-required="true"
              aria-describedby="error-reg-name"
            />
            <span id="error-reg-name" class="field-error" role="alert"></span>
          </div>

          <!-- Email Address -->
          <div class="form-group col-full">
            <label for="reg-email" class="form-label">
              <span>Email Address <span aria-hidden="true">*</span></span>
            </label>
            <input 
              type="email" 
              id="reg-email" 
              name="email" 
              class="form-input" 
              placeholder="e.g. jordan@example.com" 
              autocomplete="email" 
              required 
              aria-required="true"
              aria-describedby="error-reg-email"
            />
            <span id="error-reg-email" class="field-error" role="alert"></span>
          </div>

          <!-- Contact Phone -->
          <div class="form-group">
            <label for="reg-phone" class="form-label">
              <span>Contact Phone</span>
            </label>
            <input 
              type="tel" 
              id="reg-phone" 
              name="phone" 
              class="form-input" 
              placeholder="e.g. 07123 456789" 
              autocomplete="tel" 
            />
          </div>

          <!-- Postal Code -->
          <div class="form-group">
            <label for="reg-postcode" class="form-label">
              <span>Postal Code</span>
            </label>
            <input 
              type="text" 
              id="reg-postcode" 
              name="postcode" 
              class="form-input" 
              placeholder="e.g. BS1 5AH" 
              autocomplete="postal-code" 
            />
          </div>

          <!-- Street Address -->
          <div class="form-group">
            <label for="reg-address" class="form-label">
              <span>Street Address</span>
            </label>
            <input 
              type="text" 
              id="reg-address" 
              name="address" 
              class="form-input" 
              placeholder="e.g. 15 Victoria Crescent" 
              autocomplete="street-address" 
            />
          </div>

          <!-- City / Town -->
          <div class="form-group">
            <label for="reg-city" class="form-label">
              <span>City / Town</span>
            </label>
            <input 
              type="text" 
              id="reg-city" 
              name="city" 
              class="form-input" 
              placeholder="e.g. Bristol" 
              autocomplete="address-level2" 
            />
          </div>

          <!-- Password Field -->
          <div class="form-group col-full">
            <label for="reg-password" class="form-label">
              <span>Password (Minimum 6 characters) <span aria-hidden="true">*</span></span>
            </label>
            <div class="password-input-group">
              <input 
                type="password" 
                id="reg-password" 
                name="password" 
                class="form-input" 
                placeholder="Choose a secure password" 
                autocomplete="new-password" 
                required 
                aria-required="true"
                aria-describedby="error-reg-password"
              />
              <button 
                type="button" 
                class="password-toggle-btn" 
                data-target="reg-password" 
                aria-label="Show password"
                title="Show / hide password text"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            
            <!-- Live Password Strength Meter -->
            <div class="password-strength-container" aria-live="polite">
              <div class="password-strength-bar">
                <div id="password-strength-fill" class="password-strength-fill"></div>
              </div>
              <div class="password-strength-label">
                <span>Strength:</span>
                <span id="password-strength-text">Minimum 6 characters</span>
              </div>
            </div>
            <span id="error-reg-password" class="field-error" role="alert"></span>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group col-full">
            <label for="reg-confirm-password" class="form-label">
              <span>Confirm Password <span aria-hidden="true">*</span></span>
              <span id="password-match-notice" style="font-size:0.75rem; font-weight:600;"></span>
            </label>
            <div class="password-input-group">
              <input 
                type="password" 
                id="reg-confirm-password" 
                name="confirmPassword" 
                class="form-input" 
                placeholder="Re-enter your password" 
                autocomplete="new-password" 
                required 
                aria-required="true"
                aria-describedby="error-reg-confirm-password"
              />
              <button 
                type="button" 
                class="password-toggle-btn" 
                data-target="reg-confirm-password" 
                aria-label="Show confirm password"
                title="Show / hide password text"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span id="error-reg-confirm-password" class="field-error" role="alert"></span>
          </div>

          <!-- Terms & Conditions Checkbox -->
          <div class="form-group col-full" style="margin-top: 0.5rem;">
            <label class="checkbox-label">
              <input type="checkbox" id="reg-terms" required aria-required="true" />
              <span style="font-size: 0.85rem;">
                I agree to the <a href="#" class="auth-link" onclick="alert('Simulation Terms: This is an academic demonstrator e-commerce app. All data is saved exclusively inside your browser localStorage.'); return false;">Terms of Service</a> and Privacy Notice (Academic Demo).
              </span>
            </label>
            <span id="error-reg-terms" class="field-error" role="alert"></span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-auth-submit" style="margin-top: 1.5rem;">
          <span>Create Account & Sign In</span>
        </button>
      </form>

      <!-- Footer switch link -->
      <div class="auth-footer">
        Already have an account? 
        <a href="login.html" class="auth-link">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Script -->
  <script type="module" src="auth-pages.js"></script>
</body>
</html>
